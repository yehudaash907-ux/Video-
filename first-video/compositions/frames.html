  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const blurIn = { opacity: 0, filter: "blur(8px)" };
      const sharp = { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" };

      // Start state matches the end of the code scene: one solid black band.

      // The film travels at constant speed for the whole scene; both renders share one move.
      tl.fromTo(["#strip-a-row", "#strip-b-row"], { x: 0 }, { x: 1000, duration: 6.4, ease: "none" }, 0);

      // Beat A: holes punch through, frames build in from the right, the counter runs.
      tl.fromTo(".strip-a-fill", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out" }, 0.05);
      tl.fromTo(
        ".strip-a-frame",
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.32, ease: "expo.out", stagger: { each: 0.04, from: "end" } },
        0.12,
      );
      tl.fromTo("#frames-head-a", blurIn, sharp, 0.3);
      tl.fromTo("#frames-counter", blurIn, sharp, 0.45);
      const counter = { v: 1 };
      const countEl = document.querySelector("#frames-count");
      tl.fromTo(
        counter,
        { v: 1 },
        {
          v: 180,
          duration: 2.4,
          ease: "none",
          onUpdate: () => {
            countEl.textContent = String(Math.round(counter.v)).padStart(3, "0");
          },
        },
        0.45,
      );
      tl.to(["#frames-head-a", "#frames-counter"], {
        opacity: 0,
        filter: "blur(8px)",
        duration: 0.16,
        stagger: 0.04,
        ease: "power3.in",
      }, 2.95);

      // Beat B: the ground floods blue, render A lifts, render B rises in below in sync.
      tl.fromTo(
        "#frames-ground",
        { backgroundColor: "#f2c12e" },
        { backgroundColor: "#2340e0", duration: 0.4, ease: "power2.inOut" },
        3.15,
      );
      tl.fromTo("#strip-a", { y: 0, scale: 1 }, { y: -175, scale: 0.78, duration: 0.6, ease: "power3.inOut" }, 3.2);
      tl.fromTo("#strip-b", { y: 700, scale: 0.78 }, { y: 175, scale: 0.78, duration: 0.65, ease: "expo.out" }, 3.32);
      tl.fromTo("#frames-head-b", blurIn, sharp, 3.55);
      tl.fromTo("#frames-sub-b", blurIn, sharp, 3.95);
      tl.to(["#frames-head-b", "#frames-sub-b"], {
        opacity: 0,
        filter: "blur(8px)",
        duration: 0.15,
        stagger: 0.04,
        ease: "power3.in",
      }, 5.85);

      // Whip: both strips accelerate off to the right; the cut lands mid-move.
      tl.fromTo(
        ["#strip-a", "#strip-b"],
        { x: 0, filter: "blur(0px)" },
        { x: 2600, filter: "blur(16px)", duration: 0.42, ease: "power3.in", immediateRender: false },
        6.05,
      );

      window.__timelines["frames"] = tl;
